[workspace]
members = ["crates/album-core", "crates/album-export", "crates/album-media", "crates/album-store", "crates/album-text", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

# Decoding photos in an unoptimised build is painfully slow, even during development.
[profile.dev.package."*"]
opt-level = 2