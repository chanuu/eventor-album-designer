[package]
name = "eventor-album-designer"
description = "Desktop album designer for Eventor"
edition.workspace = true
version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
album-core = { path = "../crates/album-core" }
album-media = { path = "../crates/album-media" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"