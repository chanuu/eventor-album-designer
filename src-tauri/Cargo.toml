[package]
name = "eventor-album-designer"
description = "Desktop album designer for Eventor"
edition.workspace = true
version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
album-core = { path = "../crates/album-core" }
album-export = { path = "../crates/album-export" }
album-media = { path = "../crates/album-media" }
album-store = { path = "../crates/album-store" }
album-text = { path = "../crates/album-text" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"