# A macOS development build of the album designer, for testing on a Mac.
#
# It is not signed with an Apple Developer ID or notarised, so macOS will refuse to open it
# until it is allowed: right-click the app and choose Open, or run
#   xattr -cr "/Applications/Eventor Album Designer.app"
# The build is universal, so it runs on both Apple silicon and Intel Macs.

name: macOS dev build

on:
  workflow_dispatch:
  push:
    branches: [development]
  pull_request:
    branches: [development, main]

concurrency:
  group: macos-dev-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # macos-14 has been retired, and GitHub refuses jobs that ask for it.
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # The same public project address and anon key the studio admin ships with.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Ad-hoc signing: enough for a Mac to run it, not enough to skip Gatekeeper.
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4

      - name: Check the Eventor connection is set
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - run: pnpm install --frozen-lockfile

      - name: Test the photo and layout code
        run: cargo test --workspace --exclude eventor-album-designer --quiet

      - name: Build the app
        run: pnpm tauri build --target universal-apple-darwin --bundles app dmg

      - uses: actions/upload-artifact@v4
        with:
          name: eventor-album-designer-macos-${{ github.sha }}
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
