[package]
name = "album-export"
description = "Renders spreads from the original photos and writes print files for the lab."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
album-core = { path = "../album-core" }
album-media = { path = "../album-media" }
album-store = { path = "../album-store" }
album-text = { path = "../album-text" }
blake3 = "1"
fast_image_resize = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
pdf-writer = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"