[package]
name = "album-media"
description = "Finding photos on disk and making the preview copies the designer works from."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
album-core = { path = "../album-core" }
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
rayon = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
walkdir = "2"