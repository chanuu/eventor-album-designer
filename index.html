<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventor Album Designer</title>
    <style>
      /* Drawn before any script runs, so the window is never blank while the app starts. */
      html, body { margin: 0; height: 100%; background: #1b1c21; }
      #splash {
        position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px; background: radial-gradient(circle at 50% 38%, #2a1c27 0%, #1b1c21 62%);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #f2f2f5;
        transition: opacity 0.35s ease;
      }
      #splash.gone { opacity: 0; pointer-events: none; }
      #splash .mark {
        display: grid; place-items: center; width: 84px; height: 84px; border-radius: 22px;
        font-size: 42px; font-weight: 800; color: #fff;
        background: linear-gradient(135deg, #e91e78, #fb5b3c);
        box-shadow: 0 18px 50px rgb(233 30 120 / 35%);
        animation: splash-rise 0.6s ease-out both;
      }
      #splash .name { text-align: center; animation: splash-rise 0.6s 0.12s ease-out both; }
      #splash .name strong { display: block; font-size: 26px; font-weight: 700; letter-spacing: 0.2px; }
      #splash .name span { display: block; margin-top: 4px; font-size: 14px; color: #a6a8b3; letter-spacing: 2px; text-transform: uppercase; }
      #splash .bar { position: relative; width: 180px; height: 3px; overflow: hidden; border-radius: 3px; background: #33343c; }
      #splash .bar::after {
        content: ''; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 3px;
        background: linear-gradient(90deg, #e91e78, #fb5b3c);
        animation: splash-run 1.1s ease-in-out infinite;
      }
      #splash .note { font-size: 12px; color: #7d7f8a; }
      @keyframes splash-run { from { left: -40%; } to { left: 100%; } }
      @keyframes splash-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #splash .mark, #splash .name { animation: none; }
        #splash .bar::after { animation-duration: 2.5s; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Eventor Album Designer is starting">
      <div class="mark" aria-hidden="true">E</div>
      <div class="name"><strong>Eventor</strong><span>Album Designer</span></div>
      <div class="bar" aria-hidden="true"></div>
      <div class="note">Starting…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
